name = "cfrss"
main = "src/index.ts"
compatibility_date = "2024-12-30"
workers_dev = true

[triggers]
crons = ["0 * * * *"]

[vars]
CRON_MAX_FEEDS = "10"

[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cfrss-db"
database_id = "813133e4-49bf-4d2f-b4ce-62ee55916158"
migrations_dir = "migrations"
